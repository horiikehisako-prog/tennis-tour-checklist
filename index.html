const STATUS_COLORS = {0:"#888", 1:"#e6a817", 2:"#2e8b57"};

// ── Unique ID generator ───────────────────────────────────
const uid = () => Math.random().toString(36).slice(2,9);

// ═══════════════════════════════════════════════════════════
// ADMIN PANEL
// ═══════════════════════════════════════════════════════════
function AdminPanel({ sections, onSave, onClose }) {
  const [draft, setDraft] = useState(JSON.parse(JSON.stringify(sections)));
  const [openSec, setOpenSec] = useState(null);
  const [saving, setSaving] = useState(false);

  const addSection = () => {
    const id = "sec_" + uid();
    setDraft(d => [...d, {
      id, title:"新しいセクション", titleEn:"New Section",
      color:"#444444", fields:[]
    }]);
    setOpenSec(id);
  };

  const removeSection = (id) => {
    if (!window.confirm("このセクションを削除しますか？")) return;
    setDraft(d => d.filter(s => s.id !== id));
    if (openSec === id) setOpenSec(null);
  };

  const updateSection = (id, key, val) => {
    setDraft(d => d.map(s => s.id === id ? {...s, [key]: val} : s));
  };

  const addField = (secId) => {
    const f = {
      id:"fld_"+uid(), label:"新しい項目", labelEn:"New Field",
      type:"text", placeholder:"", placeholderEn:"", critical:false,
      options:[], optionsEn:[]
    };
    setDraft(d => d.map(s => s.id === secId ? {...s, fields:[...s.fields, f]} : s));
  };

  const removeField = (secId, fldId) => {
    setDraft(d => d.map(s => s.id === secId
      ? {...s, fields: s.fields.filter(f => f.id !== fldId)} : s));
  };

  const updateField = (secId, fldId, key, val) => {
    setDraft(d => d.map(s => s.id === secId
      ? {...s, fields: s.fields.map(f => f.id === fldId ? {...f, [key]: val} : f)} : s));
  };

  const handleSave = async () => {
    setSaving(true);
    await onSave(draft);
    setSaving(false);
  };

  const s_ = {
    overlay:{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:200,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"20px 12px",overflowY:"auto"},
    panel:{background:"#fff",borderRadius:14,width:"100%",maxWidth:740,padding:0,overflow:"hidden",boxShadow:"0 8px 40px rgba(0,0,0,0.25)"},
    header:{background:"#0a1628",color:"#fff",padding:"16px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"},
    body:{padding:"16px",maxHeight:"70vh",overflowY:"auto"},
    secBlock:{border:"2px solid #e5e7eb",borderRadius:10,marginBottom:12,overflow:"hidden"},
    secHead:{display:"flex",alignItems:"center",gap:8,padding:"10px 14px",background:"#f7f5f0",cursor:"pointer"},
    secTitle:{fontWeight:700,fontSize:14,flex:1},
    row:{display:"flex",gap:8,marginBottom:6,flexWrap:"wrap"},
    label:{fontSize:12,fontWeight:600,color:"#374151",marginBottom:3,display:"block"},
    inp:{width:"100%",padding:"7px 10px",border:"1.5px solid #d1d5db",borderRadius:6,fontSize:13},
    sel:{width:"100%",padding:"7px 10px",border:"1.5px solid #d1d5db",borderRadius:6,fontSize:13,background:"#fff"},
    fldBlock:{background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:8,padding:"10px 12px",marginBottom:8},
    btn:{padding:"6px 14px",borderRadius:6,border:"none",fontSize:12,fontWeight:700,cursor:"pointer"},
    addBtn:{background:"#e8a020",color:"#0a1628",padding:"8px 18px",borderRadius:8,border:"none",fontWeight:700,fontSize:13,cursor:"pointer"},
    saveBtn:{background:"#059669",color:"#fff",padding:"12px 28px",borderRadius:8,border:"none",fontWeight:700,fontSize:14,cursor:"pointer"},
    closeBtn:{background:"transparent",border:"1.5px solid rgba(255,255,255,0.4)",color:"#fff",padding:"6px 14px",borderRadius:6,fontWeight:600,fontSize:13,cursor:"pointer"},
    danger:{background:"#fee2e2",color:"#b91c1c",padding:"4px 10px",borderRadius:6,border:"none",fontSize:11,fontWeight:700,cursor:"pointer"},
    check:{accentColor:"#059669",width:14,height:14},
    colSwatch:{width:28,height:28,borderRadius:6,border:"2px solid #d1d5db",cursor:"pointer"},
  };

  return (
    <div style={s_.overlay}>
      <div style={s_.panel}>
        <div style={s_.header}>
          <div>
            <div style={{fontWeight:900,fontSize:16}}>⚙️ 管理画面 — セクション・項目を編集</div>
            <div style={{fontSize:12,opacity:0.7,marginTop:2}}>変更後は「保存」を押してください</div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button style={s_.saveBtn} onClick={handleSave} disabled={saving}>
              {saving ? "保存中…" : "💾 保存"}
            </button>
            <button style={s_.closeBtn} onClick={onClose}>✕ 閉じる</button>
          </div>
        </div>

        <div style={s_.body}>
          {draft.map((sec, si) => (
            <div key={sec.id} style={s_.secBlock}>
              {/* Section header */}
              <div style={{...s_.secHead, borderLeft:`4px solid ${sec.color}`}}
                onClick={() => setOpenSec(openSec === sec.id ? null : sec.id)}>
                <div style={{width:16,height:16,borderRadius:4,background:sec.color,flexShrink:0}}/>
                <div style={s_.secTitle}>{sec.title}</div>
                <span style={{fontSize:11,color:"#6b7280"}}>{sec.fields.length}項目</span>
                <span style={{fontSize:14,color:"#6b7280"}}>{openSec === sec.id ? "▲" : "▼"}</span>
                <button style={s_.danger} onClick={e=>{e.stopPropagation();removeSection(sec.id);}}>削除</button>
              </div>

              {openSec === sec.id && (
                <div style={{padding:"12px 14px"}}>
                  {/* Section meta */}
                  <div style={s_.row}>
                    <div style={{flex:1,minWidth:140}}>
                      <label style={s_.label}>セクション名（日本語）</label>
                      <input style={s_.inp} value={sec.title} onChange={e=>updateSection(sec.id,"title",e.target.value)}/>
                    </div>
                    <div style={{flex:1,minWidth:140}}>
                      <label style={s_.label}>Section name (English)</label>
                      <input style={s_.inp} value={sec.titleEn||""} onChange={e=>updateSection(sec.id,"titleEn",e.target.value)}/>
                    </div>
                    <div style={{flexShrink:0}}>
                      <label style={s_.label}>カラー</label>
                      <input type="color" value={sec.color} style={{width:44,height:32,border:"none",cursor:"pointer",borderRadius:6,padding:0}}
                        onChange={e=>updateSection(sec.id,"color",e.target.value)}/>
                    </div>
                  </div>

                  {/* Fields */}
                  <div style={{marginTop:8}}>
                    <div style={{fontSize:13,fontWeight:700,color:"#374151",marginBottom:8}}>項目一覧</div>
                    {sec.fields.map((fld,fi) => (
                      <div key={fld.id} style={s_.fldBlock}>
                        <div style={{display:"flex",justifyContent:"space-between",marginBottom:8,alignItems:"center"}}>
                          <div style={{fontSize:12,fontWeight:700,color:"#6b7280"}}>項目 {fi+1}</div>
                          <div style={{display:"flex",gap:6,alignItems:"center"}}>
                            <label style={{fontSize:11,fontWeight:600,color:"#059669",display:"flex",gap:4,alignItems:"center",cursor:"pointer"}}>
                              <input type="checkbox" checked={fld.critical||false} style={s_.check}
                                onChange={e=>updateField(sec.id,fld.id,"critical",e.target.checked)}/>
                              必須
                            </label>
                            <button style={s_.danger} onClick={()=>removeField(sec.id,fld.id)}>削除</button>
                          </div>
                        </div>
                        <div style={s_.row}>
                          <div style={{flex:1,minWidth:120}}>
                            <label style={s_.label}>項目名（日本語）</label>
                            <input style={s_.inp} value={fld.label} onChange={e=>updateField(sec.id,fld.id,"label",e.target.value)}/>
                          </div>
                          <div style={{flex:1,minWidth:120}}>
                            <label style={s_.label}>Field name (English)</label>
                            <input style={s_.inp} value={fld.labelEn||""} onChange={e=>updateField(sec.id,fld.id,"labelEn",e.target.value)}/>
                          </div>
                          <div style={{width:110}}>
                            <label style={s_.label}>入力タイプ</label>
                            <select style={s_.sel} value={fld.type} onChange={e=>updateField(sec.id,fld.id,"type",e.target.value)}>
                              <option value="text">テキスト</option>
                              <option value="number">数値</option>
                              <option value="textarea">テキストエリア</option>
                              <option value="date">日付</option>
                              <option value="select">選択肢</option>
                            </select>
                          </div>
                        </div>
                        <div style={s_.row}>
                          <div style={{flex:1}}>
                            <label style={s_.label}>プレースホルダー（日本語）</label>
                            <input style={s_.inp} value={fld.placeholder||""} onChange={e=>updateField(sec.id,fld.id,"placeholder",e.target.value)}/>
                          </div>
                          <div style={{flex:1}}>
                            <label style={s_.label}>Placeholder (English)</label>
                            <input style={s_.inp} value={fld.placeholderEn||""} onChange={e=>updateField(sec.id,fld.id,"placeholderEn",e.target.value)}/>
                          </div>
                        </div>
                        {fld.type === "select" && (
                          <div style={s_.row}>
                            <div style={{flex:1}}>
                              <label style={s_.label}>選択肢（日本語）1行1つ</label>
                              <textarea rows={3} style={{...s_.inp,resize:"vertical"}}
                                value={(fld.options||[]).join("\n")}
                                onChange={e=>updateField(sec.id,fld.id,"options",e.target.value.split("\n").filter(x=>x.trim()))}/>
                            </div>
                            <div style={{flex:1}}>
                              <label style={s_.label}>Options (English) one per line</label>
                              <textarea rows={3} style={{...s_.inp,resize:"vertical"}}
                                value={(fld.optionsEn||[]).join("\n")}
                                onChange={e=>updateField(sec.id,fld.id,"optionsEn",e.target.value.split("\n").filter(x=>x.trim()))}/>
                            </div>
                          </div>
                        )}
                      </div>
                    ))}
                    <button style={s_.addBtn} onClick={()=>addField(sec.id)}>＋ 項目を追加</button>
                  </div>
                </div>
              )}
            </div>
          ))}

          <button style={{...s_.addBtn, marginTop:8, width:"100%", padding:"12px"}} onClick={addSection}>
            ＋ セクションを追加
          </button>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════════
function App() {
  const [lang, setLang] = useState("ja");
  const [sections, setSections] = useState(null); // null = loading
  const [formData, setFormData] = useState({});
  const [statuses, setStatuses] = useState({});
  const [openSection, setOpenSection] = useState(null);
  const [connStatus, setConnStatus] = useState("checking");
  const [saveState, setSaveState] = useState("idle");
  const [lastUpdated, setLastUpdated] = useState(null);
  const [showAdmin, setShowAdmin] = useState(false);
  const skipRef = useRef(false);

  // Load sections from Firebase (or use defaults)
  useEffect(() => {
    const ref = db.ref(SECTIONS_PATH);
    ref.once("value").then(snap => {
      const val = snap.val();
      setSections(val && val.length ? val : DEFAULT_SECTIONS);
      if (openSection === null && (val||DEFAULT_SECTIONS).length > 0) {
        setOpenSection((val||DEFAULT_SECTIONS)[0].id);
      }
    }).catch(() => {
      setSections(DEFAULT_SECTIONS);
      setOpenSection(DEFAULT_SECTIONS[0].id);
    });
  }, []);

  // Real-time listener for checklist data
  useEffect(() => {
    const ref = db.ref(CHECKLIST_PATH);
    const listener = ref.on("value", snap => {
      if (skipRef.current) { skipRef.current = false; setConnStatus("ok"); return; }
      const val = snap.val();
      if (val) {
        setFormData(val.data || {});
        setStatuses(val.statuses || {});
        if (val.updatedAt) setLastUpdated(val.updatedAt);
      }
      setConnStatus("ok");
    }, () => setConnStatus("error"));
    return () => ref.off("value", listener);
  }, []);

  const setValue = (id, val) => setFormData(d => ({...d, [id]: val}));
  const setStatus = (id, val) => setStatuses(s => ({...s, [id]: val}));

  const handleSave = () => {
    setSaveState("saving");
    const now = new Date().toISOString();
    skipRef.current = true;
    db.ref(CHECKLIST_PATH).set({data: formData, statuses, updatedAt: now})
      .then(() => { setLastUpdated(now); setSaveState("saved"); setTimeout(()=>setSaveState("idle"),2000); })
      .catch(() => { skipRef.current = false; setSaveState("error"); setTimeout(()=>setSaveState("idle"),3000); });
  };

  const handleSaveSections = async (newSections) => {
    await db.ref(SECTIONS_PATH).set(newSections);
    setSections(newSections);
    setShowAdmin(false);
  };

  if (!sections) return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",fontSize:16,color:"#6b7280"}}>
      読み込み中…
    </div>
  );

  const totalCritical = sections.flatMap(s => s.fields.filter(f => f.critical));
  const totalFilled = totalCritical.filter(f => formData[f.id] && formData[f.id] !== "");
  const overallPct = totalCritical.length ? Math.round(totalFilled.length / totalCritical.length * 100) : 0;

  const t = (ja, en) => lang === "ja" ? ja : en;

  const ss = {
    page:{minHeight:"100vh",background:"#f7f5f0",fontFamily:"'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif",paddingBottom:60},
    header:{background:"linear-gradient(135deg,#0a1628 0%,#8b0000 100%)",color:"#fff",padding:"28px 20px 20px",borderBottom:"4px solid #e8a020"},
    inner:{maxWidth:720,margin:"0 auto"},
    langBar:{display:"flex",justifyContent:"flex-end",marginBottom:12,gap:6},
    langBtn:(active)=>({padding:"5px 16px",borderRadius:16,border:"none",cursor:"pointer",fontWeight:700,fontSize:13,background:active?"#e8a020":"rgba(255,255,255,0.15)",color:active?"#0a1628":"rgba(255,255,255,0.8)",transition:"all 0.2s"}),
    badge:{display:"inline-block",background:"rgba(255,255,255,0.12)",border:"1px solid rgba(255,255,255,0.2)",color:"#fff",padding:"4px 12px",borderRadius:16,fontSize:12,fontWeight:600,marginRight:6,marginBottom:4},
    connOk:{fontSize:12,fontWeight:600,color:"#6ee7b7",marginTop:10},
    connErr:{fontSize:12,fontWeight:600,color:"#fca5a5",marginTop:10},
    connChk:{fontSize:12,fontWeight:600,color:"#fde68a",marginTop:10},
    progressWrap:{marginTop:16,background:"rgba(255,255,255,0.15)",borderRadius:8,padding:"12px 14px"},
    progressRow:{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:6},
    progressBar:{height:8,background:"rgba(255,255,255,0.2)",borderRadius:4,overflow:"hidden"},
    progressFill:(pct)=>({height:"100%",width:`${pct}%`,background:"#e8a020",borderRadius:4,transition:"width 0.5s"}),
    saveBtn:(state)=>({width:"100%",padding:"12px",borderRadius:8,border:"none",fontWeight:700,fontSize:15,marginTop:10,cursor:state==="saving"?"default":"pointer",background:state==="saved"?"#059669":state==="error"?"#c8102e":"#e8a020",color:state==="saved"||state==="error"?"#fff":"#0a1628",opacity:state==="saving"?0.7:1}),
    adminBtn:{background:"rgba(255,255,255,0.15)",border:"1.5px solid rgba(255,255,255,0.3)",color:"#fff",padding:"7px 16px",borderRadius:8,fontSize:12,fontWeight:700,cursor:"pointer",marginTop:10},
    warning:{background:"#fff8e1",border:"2px solid #e8a020",borderRadius:10,padding:"12px 14px",marginBottom:16,fontSize:13,lineHeight:1.7},
    secCard:{background:"#fff",borderRadius:12,marginBottom:10,boxShadow:"0 2px 8px rgba(0,0,0,0.07)",overflow:"hidden"},
    secBtn:(isOpen,color)=>({width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 16px",background:isOpen?color:"#fff",color:isOpen?"#fff":"#1f2937",border:"none",cursor:"pointer",textAlign:"left",transition:"background 0.2s"}),
    fieldWrap:{padding:"14px 14px 18px"},
    fieldRow:{marginBottom:14},
    fieldLabelRow:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:5},
    req:{color:"#fff",background:"#c8102e",fontSize:10,fontWeight:700,padding:"1px 5px",borderRadius:4},
    fieldLabel:{fontSize:13,fontWeight:600,color:"#1f2937",display:"flex",alignItems:"center",gap:5},
    statusDots:{display:"flex",gap:4,alignItems:"center",flexShrink:0,marginLeft:8},
    statusDot:(i,cur)=>({width:i===cur?26:18,height:18,borderRadius:9,background:i===cur?STATUS_COLORS[i]:"#e0e0e0",border:"none",cursor:"pointer",transition:"all 0.2s",fontSize:i===2&&i===cur?11:0,color:"#fff",fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}),
    statusLabel:(i)=>({fontSize:10,color:STATUS_COLORS[i],fontWeight:600,minWidth:55}),
    input:(filled,color)=>({width:"100%",padding:"8px 10px",border:`1.5px solid ${filled?color:"#d1d5db"}`,borderRadius:8,fontSize:13,fontFamily:"inherit",lineHeight:1.6}),
    summaryBox:{marginTop:14,background:"#0a1628",color:"#fff",borderRadius:12,padding:"14px 18px",fontSize:13,lineHeight:1.8},
  };

  const statLabels = {
    ja: ["未記入","記入済み（要確認）","双方合意✅"],
    en: ["Not filled","Filled (to check)","Both agreed ✅"],
  };

  return (
    <div style={ss.page}>
      {showAdmin && (
        <AdminPanel
          sections={sections}
          onSave={handleSaveSections}
          onClose={() => setShowAdmin(false)}
        />
      )}

      {/* Header */}
      <div style={ss.header}>
        <div style={ss.inner}>
          <div style={ss.langBar}>
            <button style={ss.langBtn(lang==="ja")} onClick={()=>setLang("ja")}>🇯🇵 日本語</button>
            <button style={ss.langBtn(lang==="en")} onClick={()=>setLang("en")}>🇺🇸 English</button>
          </div>
          <div style={{fontSize:11,letterSpacing:3,opacity:0.7,marginBottom:6}}>🎾 JAPAN–USA TENNIS TOUR</div>
          <h1 style={{fontSize:20,fontWeight:900,lineHeight:1.3,margin:0}}>
            {t("ツアーコーディネート チェックリスト","Tour Coordination Checklist")}
          </h1>
          <div style={{marginTop:4,fontSize:13,opacity:0.85}}>
            {t("コロンバイン高校 × 福山・広島","Columbine High School × Fukuyama & Hiroshima")}
          </div>

          {/* Badges */}
          <div style={{marginTop:10}}>
            {connStatus==="ok" && <span style={ss.connOk}>🟢 {t("接続OK・自動で双方に反映","Connected — syncing both sides")}</span>}
            {connStatus==="checking" && <span style={ss.connChk}>🟡 {t("接続確認中…","Checking connection…")}</span>}
            {connStatus==="error" && <span style={ss.connErr}>🔴 {t("接続できません","Connection failed")}</span>}
          </div>

          {/* Progress */}
          <div style={ss.progressWrap}>
            <div style={ss.progressRow}>
              <span>{t("必須項目の記入進捗","Required fields progress")}</span>
              <span style={{fontWeight:700,color:"#e8a020"}}>{totalFilled.length} / {totalCritical.length} ({overallPct}%)</span>
            </div>
            <div style={ss.progressBar}><div style={ss.progressFill(overallPct)}/></div>
          </div>

          {/* Save */}
          <button style={ss.saveBtn(saveState)} onClick={handleSave} disabled={saveState==="saving"}>
            {saveState==="saving" ? t("保存中…","Saving…")
             : saveState==="saved" ? t("保存しました✅","Saved ✅")
             : saveState==="error" ? t("⚠️ 保存に失敗しました","⚠️ Save failed")
             : t("💾 保存する","💾 Save")}
          </button>

          <div style={{marginTop:8,fontSize:11,opacity:0.7}}>
            {t("最終更新","Last updated")}: {lastUpdated ? new Date(lastUpdated).toLocaleString(lang==="ja"?"ja-JP":"en-US") : t("まだ保存されていません","Not saved yet")}
          </div>

          {/* Admin button */}
          <button style={ss.adminBtn} onClick={()=>setShowAdmin(true)}>
            ⚙️ {t("管理画面（セクション・項目を編集）","Admin: Edit sections & fields")}
          </button>
        </div>
      </div>

      {/* Body */}
      <div style={{maxWidth:720,margin:"0 auto",padding:"18px 14px"}}>
        {/* Warning */}
        <div style={ss.warning}>
          <div style={{fontWeight:700,marginBottom:4}}>⚠️ {t("思い込み防止メモ","Assumption Prevention")}</div>
          {t("「当然こうだろう」は禁物！時間・人数・費用はすべて数字で双方確認を。",
             "Never assume — confirm all times, numbers, and costs with both sides!")}<br/>
          🎤 {t("例：カラオケ20名→部屋数は？何時間？（1時間は少ない！）",
               "e.g. Karaoke for 20 people → how many rooms? How many hours? (1 hour is too short!)")}
        </div>

        {/* Sections */}
        {sections.map(sec => {
          const critFields = sec.fields.filter(f=>f.critical);
          const filled = critFields.filter(f=>formData[f.id]&&formData[f.id]!=="");
          const isOpen = openSection === sec.id;
          const l = lang;
          return (
            <div key={sec.id} style={{...ss.secCard, border:`2px solid ${isOpen?sec.color:"transparent"}`}}>
              <button style={ss.secBtn(isOpen, sec.color)}
                onClick={()=>setOpenSection(isOpen?null:sec.id)}>
                <div style={{fontWeight:700,fontSize:15}}>{l==="ja"?sec.title:sec.titleEn||sec.title}</div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <div style={{fontSize:12,background:filled.length===critFields.length?"#2e8b57":"rgba(0,0,0,0.12)",color:isOpen?"#fff":(filled.length===critFields.length?"#fff":"#555"),padding:"2px 8px",borderRadius:12,fontWeight:600}}>
                    {filled.length}/{critFields.length} {l==="ja"?"必須":"REQ"}
                  </div>
                  <span style={{fontSize:15}}>{isOpen?"▲":"▼"}</span>
                </div>
              </button>

              {isOpen && (
                <div style={ss.fieldWrap}>
                  {sec.fields.map(fld => {
                    const statusIdx = statuses[fld.id] !== undefined ? statuses[fld.id] : 0;
                    const label = l==="ja" ? fld.label : (fld.labelEn || fld.label);
                    const placeholder = l==="ja" ? (fld.placeholder||"") : (fld.placeholderEn||fld.placeholder||"");
                    const opts = l==="ja" ? (fld.options||[]) : (fld.optionsEn||fld.options||[]);
                    const optsJa = fld.options||[];
                    const filled = formData[fld.id] && formData[fld.id] !== "";
                    return (
                      <div key={fld.id} style={ss.fieldRow}>
                        <div style={ss.fieldLabelRow}>
                          <label style={ss.fieldLabel}>
                            {fld.critical && <span style={ss.req}>{l==="ja"?"必須":"REQ"}</span>}
                            {label}
                          </label>
                          <div style={ss.statusDots}>
                            {[0,1,2].map(i=>(
                              <button key={i} title={statLabels[l][i]}
                                onClick={()=>setStatus(fld.id,i)}
                                style={ss.statusDot(i,statusIdx)}>
                                {i===2&&statusIdx===2?"✓":""}
                              </button>
                            ))}
                            <span style={ss.statusLabel(statusIdx)}>{statLabels[l][statusIdx]}</span>
                          </div>
                        </div>

                        {fld.type==="textarea" ? (
                          <textarea value={formData[fld.id]||""} onChange={e=>setValue(fld.id,e.target.value)}
                            placeholder={placeholder} rows={3}
                            style={{...ss.input(filled,sec.color),resize:"vertical"}}/>
                        ) : fld.type==="select" ? (
                          <select value={formData[fld.id]||""} onChange={e=>setValue(fld.id,e.target.value)}
                            style={{...ss.input(filled,sec.color),cursor:"pointer"}}>
                            <option value="">{l==="ja"?"— 選択してください —":"— Please select —"}</option>
                            {opts.map((o,i)=>(
                              <option key={o} value={optsJa[i]||o}>{o}</option>
                            ))}
                          </select>
                        ) : (
                          <input type={fld.type} value={formData[fld.id]||""} onChange={e=>setValue(fld.id,e.target.value)}
                            placeholder={placeholder}
                            style={ss.input(filled,sec.color)}/>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}

        {/* Summary */}
        <div style={ss.summaryBox}>
          <div style={{fontWeight:700,marginBottom:8,color:"#e8a020"}}>
            📋 {t("全体ステータス確認","Overall Status")}
          </div>
          {sections.map(s=>{
            const c=s.fields.filter(f=>f.critical);
            const f=c.filter(f=>formData[f.id]&&formData[f.id]!=="");
            return(
              <div key={s.id} style={{display:"flex",justifyContent:"space-between",borderBottom:"1px solid rgba(255,255,255,0.1)",padding:"3px 0"}}>
                <span style={{fontSize:12}}>{lang==="ja"?s.title:s.titleEn||s.title}</span>
                <span style={{fontSize:12,color:f.length===c.length?"#6ee7b7":"#fde68a"}}>
                  {f.length===c.length?"✅":`${f.length}/${c.length}`}
                </span>
              </div>
            );
          })}
        </div>

        {/* Bottom save */}
        <button style={{...ss.saveBtn(saveState),marginTop:14,padding:"14px"}} onClick={handleSave} disabled={saveState==="saving"}>
          {saveState==="saving" ? t("保存中…","Saving…")
           : saveState==="saved" ? t("保存しました✅","Saved ✅")
           : t("💾 保存する","💾 Save")}
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
